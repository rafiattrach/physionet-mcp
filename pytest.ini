[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/physionet_mcp
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

markers =
    security: marks tests for security validation (SQL injection protection)
    integration: marks tests for integration with BigQuery
    unit: marks tests for unit testing of individual functions
